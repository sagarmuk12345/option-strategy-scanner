name: Hourly Options Scanner

on:
  schedule:
    # Runs at minute 0 of every hour from 14:00 UTC to 21:00 UTC, Monday through Friday
    # This aligns perfectly with US stock market active hours.
    - cron: '0 14-21 * * 1-5'
  workflow_dispatch: # Keeps the manual "Run workflow" play button active for you anytime

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Options Scanner Pipeline
      env:
        # Securely injects your private Discord Webhook from repository settings
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python main.py
